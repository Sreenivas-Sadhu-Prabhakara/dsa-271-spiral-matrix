<text x="56.0" y="247.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Four boundary variables (top, bottom, left, right); each completed edge moves its</text>
